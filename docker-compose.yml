services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: cheche_crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d cheche_crm"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  migrate:
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgresql://crm:${POSTGRES_PASSWORD}@postgres:5432/cheche_crm
    depends_on:
      postgres: { condition: service_healthy }
    profiles: ["tools"]

  web:
    build: { context: ., target: runner }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://crm:${POSTGRES_PASSWORD}@postgres:5432/cheche_crm
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  # worker（邮件同步、公海回收）在 P1/P3 加入

volumes:
  pgdata:
  redisdata:
