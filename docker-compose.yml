services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: cheche_crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d cheche_crm"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  migrate:
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgresql://crm:${POSTGRES_PASSWORD}@postgres:5432/cheche_crm
    depends_on:
      postgres: { condition: service_healthy }
    profiles: ["tools"]

  web:
    build: { context: ., target: runner }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://crm:${POSTGRES_PASSWORD}@postgres:5432/cheche_crm
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /data/uploads
      APP_SECRET: ${APP_SECRET:?请在 .env 中设置 APP_SECRET（openssl rand -hex 32，设定后不要再改）}
      AI_BASE_URL: ${AI_BASE_URL:-https://moonup.dev}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-deepseek-v4.1-flash-1017}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_REGION: ${OSS_REGION:-cn-hongkong}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
    volumes:
      - uploads:/data/uploads
    # 不直接对外暴露，统一经 caddy 走 HTTPS
    expose:
      - "3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  # 反向代理 + 自动 HTTPS（Let's Encrypt 证书自动申请、续期）
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?请在 .env 中设置 APP_DOMAIN（域名，已解析到本机）}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web

  # 后台任务：邮件同步与 AI 分析、WhatsApp 连接与收发、公海回收
  worker:
    build: { context: ., target: migrate }
    command: ["pnpm", "worker"]
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      NODE_ENV: production
      TZ: Asia/Hong_Kong
      DATABASE_URL: postgresql://crm:${POSTGRES_PASSWORD}@postgres:5432/cheche_crm
      UPLOAD_DIR: /data/uploads
      WA_AUTH_DIR: /data/whatsapp
      APP_SECRET: ${APP_SECRET:?请在 .env 中设置 APP_SECRET}
      AI_BASE_URL: ${AI_BASE_URL:-https://moonup.dev}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-deepseek-v4.1-flash-1017}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_REGION: ${OSS_REGION:-cn-hongkong}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
    volumes:
      - uploads:/data/uploads
      - whatsapp:/data/whatsapp
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  uploads:
  whatsapp:
  caddydata:
  caddyconfig:
